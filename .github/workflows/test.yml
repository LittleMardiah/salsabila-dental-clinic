name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint configured"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Sementara skip test karena belum ada
      # - name: Test
      #   run: npm run test